<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Agni Advisors</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#E35B1E">
<meta name="color-scheme" content="light">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
:root{
  --orange:#E35B1E;
  --orange-ink:#C24A12;    /* link text: 4.6:1 on --paper (WCAG AA) */
  --orange-ink-hover:#9C3A0B;
  --ink:#2B2B2B;
  --ink-soft:#514C47;
  --paper:#FAF8F5;
  --hairline:#E2DBD2;
  --measure:680px;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua","Noto Serif","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}

*,*::before,*::after{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:1.0625rem;
  line-height:1.75;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:var(--measure);
  margin-inline:auto;
  width:100%;
  padding-inline:clamp(1.25rem,5vw,2rem);
}

/* ---------- Header band ---------- */

.masthead{
  background:var(--orange);
  padding-block:clamp(2.75rem,9vw,4.5rem);
}

.wordmark{
  margin:0;
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(2.75rem,10vw,4.5rem);
  line-height:1.02;
  letter-spacing:-0.022em;
}

/* The wordmark reads as the brand, not as a link — the link orange would
   not carry enough contrast on the orange band anyway. */
.wordmark a{
  color:var(--ink);
  text-decoration:none;
}
.wordmark a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.1em}
.wordmark a:focus-visible{outline:3px solid var(--ink);outline-offset:6px;border-radius:2px}

/* ---------- Body ---------- */

main{
  flex:1 0 auto;
  padding-block:clamp(2.75rem,8vw,4.5rem) clamp(2.5rem,7vw,4rem);
}

h1{
  margin:0 0 1.25rem;
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(1.75rem,5.4vw,2.25rem);
  line-height:1.2;
  letter-spacing:-0.015em;
  text-wrap:balance;
  color:var(--ink);
}

p{margin:0}

/* ---------- Links ---------- */

a{
  color:var(--orange-ink);
  text-decoration-thickness:1px;
  text-underline-offset:.18em;
}
a:hover{color:var(--orange-ink-hover);text-decoration-thickness:2px}
a:focus-visible{
  outline:2px solid var(--orange-ink);
  outline-offset:3px;
  border-radius:2px;
}

/* ---------- Footer ---------- */

footer>.rule{
  border-top:1px solid var(--hairline);
  padding-block:clamp(1.75rem,5vw,2.5rem) clamp(2.5rem,7vw,3.5rem);
  font-size:.9375rem;
  line-height:1.7;
  color:var(--ink-soft);
}

footer p{margin:0}
footer .legal{margin-top:.5rem}

/* Cloudflare Email Obfuscation swaps the address for a span until JS decodes it. */
.__cf_email__{word-break:break-word}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="wordmark"><a href="/">Agni Advisors</a></p>
  </div>
</header>

<main class="wrap">
  <h1>Whoops. That page doesn&rsquo;t exist.</h1>
  <p><a href="/">Back to the home page&nbsp;&rarr;</a></p>
</main>

<footer class="wrap">
  <div class="rule">
  <p><a href="mailto:analysts@agniadvisors.com">analysts@agniadvisors.com</a></p>
  <p class="legal">&copy; 2026 Agni Advisors, a Grundemann Technology Solutions company.</p>
  </div>
</footer>

</body>
</html>
